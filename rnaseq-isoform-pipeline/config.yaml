# ============================================================
# RNA-Seq Isoform Quantification Pipeline — configuration
# ============================================================
# data_source controls which branch of the Snakefile runs:
#   "toy"  -> generates a small synthetic dataset locally 
#   "real" -> downloads the rnaseqDTU / GENCODE data 
data_source: "toy"

seed: 42

# ------------------------------------------------------------------
# Toy dataset parameters
# ------------------------------------------------------------------
# We simulate N genes, each with 2 isoforms related by a simple
# exon-skipping event (isoform 1 = exonA+exonB+exonC, isoform 2 =
# exonA+exonC). The first `n_dtu_genes` genes get isoform usage
# proportions that differ between conditions (the "true DTU" genes);
# the rest keep a constant 50/50 usage in both conditions (the "null"
# genes). Mixing signal and null genes lets us actually validate that
# the downstream DTU analysis (DRIMSeq/stageR) distinguishes them.
#
# DRIMSeq estimates a precision parameter shared across genes
# (empirical Bayes shrinkage), which needs a reasonable number of
# genes to be stable, a handful of genes (as in earlier versions of
# this config) is not enough and produces degenerate results. 100
# genes is still "toy" scale (runs in seconds) but gives DRIMSeq
# something workable.
toy:
  n_genes: 100
  n_dtu_genes: 50        # first 50 genes have true differential usage
  exon_length: 300
  read_length: 100
  reads_per_sample: 20000          # total read pairs per sample
  samples:
    - {id: "sample_A1", condition: "A"}
    - {id: "sample_A2", condition: "A"}
    - {id: "sample_A3", condition: "A"}
    - {id: "sample_B1", condition: "B"}
    - {id: "sample_B2", condition: "B"}
    - {id: "sample_B3", condition: "B"}
  # [prop_isoform1, prop_isoform2] per condition, applied to the DTU genes
  condition_isoform_usage:

    A: [0.8, 0.2]
    B: [0.2, 0.8]

# ------------------------------------------------------------------
# Real dataset parameters (rnaseqDTU / Love, Soneson & Patro)
# ------------------------------------------------------------------
# TODO before switching data_source to "real":
#   - resolve the exact Zenodo record(s) for the FASTQ batches
#     (uploaded in 3 batches of 8 samples; see the rnaseqDTU README
#     / F1000Research paper "Data availability" section)
#   - fill reads_urls below with one r1/r2 URL pair per sample
#   - fill transcriptome_fasta_url / gtf_url with the GENCODE v28
#     human transcriptome release used by the original workflow
real:
  transcriptome_fasta_url: ""     # e.g. GENCODE v28 transcripts.fa.gz
  gtf_url: ""                     # e.g. GENCODE v28 annotation.gtf.gz
  samples: []                    # [{id: "s1_1", condition: "1"}, ...]
  reads_urls: {}                  # {sample_id: {r1: url, r2: url}}

# ------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------
paths:
  data_dir: "data"
  results_dir: "results"

# ------------------------------------------------------------------
# Salmon
# ------------------------------------------------------------------
salmon:
  threads: 4
  libtype: "A"          # auto-detect library type
